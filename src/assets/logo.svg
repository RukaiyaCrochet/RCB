<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Rukaiya logo">
  <defs>
    <linearGradient id="logoGradient" x1="0" y1="256" x2="256" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <radialGradient id="highlightGradient" cx="88" cy="76" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="shadeGradient" cx="180" cy="190" r="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#be123c" stop-opacity="0.19" />
      <stop offset="100%" stop-color="#be123c" stop-opacity="0" />
    </radialGradient>
  </defs>

  <circle cx="128" cy="128" r="124" fill="url(#logoGradient)" />
  <circle cx="128" cy="128" r="124" fill="url(#highlightGradient)" />
  <circle cx="128" cy="128" r="124" fill="url(#shadeGradient)" />
  <text x="128" y="168" text-anchor="middle" font-family="'DM Serif Display', Georgia, 'Times New Roman', serif" font-size="150" font-style="italic" font-weight="700" fill="#ffffff">R</text>
</svg>
